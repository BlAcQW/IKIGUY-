# Asterisk REST API - HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name asterisk-api.ailabsafrica.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# Asterisk REST API - HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asterisk-api.ailabsafrica.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/asterisk-api.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asterisk-api.ailabsafrica.com/privkey.pem;

    # SSL protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Max body size for requests
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/asterisk-api.access.log;
    error_log /var/log/nginx/asterisk-api.error.log;

    # Proxy to FastAPI application (CORS handled by FastAPI)
    location / {
        proxy_pass http://127.0.0.1:30040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no auth required)
    location /health {
        proxy_pass http://127.0.0.1:30040/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;  # Don't log health checks
    }
}
