# Open WebUI - All-in-one LLM/TTS Web Interface
# Local - Port 8007

server {
    listen 80;
    listen [::]:80;
    server_name openwebui.ailabsafrica.com;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openwebui.ailabsafrica.com;

    ssl_certificate /etc/letsencrypt/live/openwebui.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openwebui.ailabsafrica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 100M;

    access_log /var/log/nginx/openwebui.access.log;
    error_log /var/log/nginx/openwebui.error.log;

    location / {
        proxy_pass http://localhost:8007;
        proxy_http_version 1.1;

        # WebSocket support for real-time chat
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Extended timeouts for LLM responses
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://localhost:8007/health;
        access_log off;
    }
}
