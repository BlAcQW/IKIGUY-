server {
    listen 80;
    listen [::]:80;
    server_name ailabsafrica.com www.ailabsafrica.com;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    return 301 https://ailabsafrica.com$request_uri;
}

# Main HTTPS Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ailabsafrica.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ailabsafrica.com/privkey.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval' *.trustedcdn.com blob:; connect-src 'self' wss://*.daily.co https://api.vapi.ai https://*.sentry.io https://*.daily.co https://*.supabase.co https://ljzbzjgvwzivpmlmuxhx.supabase.co https://generativelanguage.googleapis.com;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory
    root /var/www/ailabsafrica;
    index index.php index.html;

    # E-Commerce Optimizations
    client_max_body_size 50M;  # For large product images
    keepalive_timeout 15s;
    sendfile on;
    tcp_nopush on;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;

    # Serve demo files from /var/www/ailabsafrica/demos
    location /demos/ {
        alias /var/www/ailabsafrica/demos/;
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Type "text/html; charset=utf-8";
    }

    location / {
        try_files $uri /index.html;
    }

    # Cache Control
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # PHP-FPM Handling (for carts/checkouts)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Checkout/Account Pages - No Cache
    location ~ ^/(checkout|account|admin|auth) {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block Sensitive Paths
    location ~* ^/(\.git|\.env|config\.php|composer\.) {
        deny all;
        return 404;
    }

    # Logging
    access_log /var/log/nginx/ailabsafrica.access.log;
    error_log /var/log/nginx/ailabsafrica.error.log warn;
}

# WWW Redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ailabsafrica.com;
    return 301 https://ailabsafrica.com$request_uri;
}
