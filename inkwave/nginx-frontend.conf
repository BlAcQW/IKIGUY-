# InkWave Frontend - Nginx Configuration
server {
    if ($host = inkwave.ailabsafrica.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name inkwave.ailabsafrica.com;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type "text/plain";
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }


}

# HTTPS Configuration
server {
    server_name inkwave.ailabsafrica.com;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' https://inkwave-api.ailabsafrica.com wss://inkwave-api.ailabsafrica.com https://supabase-api.ailabsafrica.com https://api.ailabsafrica.com data: blob:; media-src 'self' https: blob: data:;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory for built static files
    root /opt/kasaai/apps/inkwave/frontend/dist;
    index index.html;

    # Optimizations
    client_max_body_size 10M;
    keepalive_timeout 15s;
    sendfile on;
    tcp_nopush on;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;

    # API Proxy to Backend
    # Short URL redirects (proxy to backend)
    location /s/ {
        proxy_pass http://127.0.0.1:30033;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:30033;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets - return 404 for missing files to force cache refresh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2|ttf|eot|woff)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # React Router SPA - main app routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block Sensitive Paths
    location ~* ^/(\.git|\.env|node_modules|src) {
        deny all;
        return 404;
    }

    # Logging
    access_log /var/log/nginx/inkwave-frontend.access.log;
    error_log /var/log/nginx/inkwave-frontend.error.log warn;

    # SSL will be added by certbot
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/inkwave.ailabsafrica.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/inkwave.ailabsafrica.com/privkey.pem; # managed by Certbot
}
