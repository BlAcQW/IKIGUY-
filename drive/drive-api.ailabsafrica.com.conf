# KasaAI Drive API - Backend
server {
    listen 80;
    listen [::]:80;
    server_name drive-api.ailabsafrica.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drive-api.ailabsafrica.com;

    ssl_certificate /etc/letsencrypt/live/drive-api.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive-api.ailabsafrica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Large file upload support
    client_max_body_size 500M;
    client_body_timeout 300s;

    access_log /var/log/nginx/drive-api.access.log;
    error_log /var/log/nginx/drive-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:30037;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large file operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
