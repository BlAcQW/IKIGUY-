[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "load-client"
version = "0.1.0"
description = "Python SDK for the LOAD voice AI platform API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]
