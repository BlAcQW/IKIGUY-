# KasaAI Drive - Frontend
server {
    listen 80;
    listen [::]:80;
    server_name drive.ailabsafrica.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drive.ailabsafrica.com;

    ssl_certificate /etc/letsencrypt/live/drive.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drive.ailabsafrica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/drive-frontend.access.log;
    error_log /var/log/nginx/drive-frontend.error.log;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js specific
    location /_next/static {
        proxy_cache STATIC;
        proxy_pass http://127.0.0.1:3005;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
