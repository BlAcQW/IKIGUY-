# Flowise AI - Low-code LLM orchestration
server {
    listen 80;
    listen [::]:80;
    server_name flowise.ailabsafrica.com;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type "text/plain";
    }

    location / {
        # Proxy to Flowise container
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket support (for real-time updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (for long-running AI operations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Large uploads (for AI model uploads/downloads)
        client_max_body_size 500M;

        # Buffer settings
        proxy_buffering off;
    }

    # Logging
    access_log /var/log/nginx/flowise.access.log;
    error_log /var/log/nginx/flowise.error.log warn;
}
