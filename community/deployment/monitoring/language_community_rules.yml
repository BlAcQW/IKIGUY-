# Prometheus alerting rules for African Language Community Platform

groups:
  - name: language_community_alerts
    rules:
      # API Health Alerts
      - alert: APIDown
        expr: up{job="language-community-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: language-community-api
        annotations:
          summary: "Language Community API is down"
          description: "The Language Community API has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: language-community-api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} requests per second"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
          service: language-community-api
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is {{ $value }} seconds"

      # System Resource Alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for more than 5 minutes"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 3m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 85%"

      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/opt/kasaai/data/community"} / node_filesystem_size_bytes{mountpoint="/opt/kasaai/data/community"})) * 100 > 85
        for: 1m
        labels:
          severity: critical
          service: storage
        annotations:
          summary: "Low disk space"
          description: "Disk space usage is above 85% on community data partition"

      # MongoDB Alerts
      - alert: MongoDBDown
        expr: up{job="mongodb"} == 0
        for: 1m
        labels:
          severity: critical
          service: mongodb
        annotations:
          summary: "MongoDB is down"
          description: "MongoDB has been down for more than 1 minute"

      - alert: MongoDBHighConnections
        expr: mongodb_connections{state="current"} > 80
        for: 2m
        labels:
          severity: warning
          service: mongodb
        annotations:
          summary: "High MongoDB connections"
          description: "MongoDB has {{ $value }} active connections"

      # Application-Specific Alerts
      - alert: HighSubmissionFailureRate
        expr: rate(submission_failed_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          service: submissions
        annotations:
          summary: "High submission failure rate"
          description: "Submission failure rate is {{ $value }} per second"

      - alert: DatasetProcessingStuck
        expr: increase(dataset_processing_started_total[1h]) > 0 and increase(dataset_processing_completed_total[1h]) == 0
        for: 30m
        labels:
          severity: warning
          service: datasets
        annotations:
          summary: "Dataset processing appears stuck"
          description: "Datasets have been started but none completed in the last hour"

      - alert: ValidationQueueBacklog
        expr: validation_queue_size > 100
        for: 10m
        labels:
          severity: warning
          service: validation
        annotations:
          summary: "Large validation queue backlog"
          description: "Validation queue has {{ $value }} pending items"

      # External Service Alerts
      - alert: SupabaseConnectionFailure
        expr: rate(supabase_connection_errors_total[5m]) > 0.01
        for: 2m
        labels:
          severity: warning
          service: supabase
        annotations:
          summary: "Supabase connection issues"
          description: "Experiencing connection issues with Supabase"

      # SSL Certificate Expiry
      - alert: SSLCertificateExpiry
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 7
        for: 1h
        labels:
          severity: warning
          service: ssl
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate expires in less than 7 days"

  - name: language_community_performance
    rules:
      # Performance metrics
      - record: instance:api_request_rate
        expr: rate(http_requests_total{job="language-community-api"}[5m])

      - record: instance:api_error_rate
        expr: rate(http_requests_total{job="language-community-api", status=~"5.."}[5m])

      - record: instance:api_latency_p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="language-community-api"}[5m]))

      - record: instance:api_latency_p99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job="language-community-api"}[5m]))

      # Community engagement metrics
      - record: instance:daily_active_users
        expr: increase(user_activity_total[24h])

      - record: instance:daily_submissions
        expr: increase(submission_created_total[24h])

      - record: instance:daily_validations
        expr: increase(validation_completed_total[24h])

      # System health score (0-1 scale)
      - record: instance:health_score
        expr: |
          (
            (up{job="language-community-api"}) * 0.3 +
            (up{job="mongodb"}) * 0.3 +
            ((100 - (100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100))) < 80) * 0.2 +
            ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 < 85) * 0.2
          )