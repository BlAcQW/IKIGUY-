# TTS Configuration for Twi/Akan Voice Synthesis
# Configuration for Coqui TTS training and deployment

model_configs:
  # Tacotron2 configuration for Twi
  tacotron2:
    model_type: "Tacotron2"
    language: "tw"  # Twi language code
    
    # Audio parameters
    audio:
      sample_rate: 22050
      n_fft: 1024
      hop_length: 256
      win_length: 1024
      n_mel_channels: 80
      mel_fmin: 0.0
      mel_fmax: 8000.0
      
    # Model architecture
    model:
      n_symbols: 150  # Extended for Twi special characters
      symbols_embedding_dim: 512
      encoder_kernel_size: 5
      encoder_n_convolutions: 3
      encoder_embedding_dim: 512
      decoder_rnn_dim: 1024
      prenet_dim: 256
      max_decoder_steps: 1000
      gate_threshold: 0.5
      p_attention_dropout: 0.1
      p_decoder_dropout: 0.1
      
    # Training parameters
    training:
      batch_size: 32
      learning_rate: 0.001
      weight_decay: 0.000001
      grad_clip: 1.0
      warmup_steps: 4000
      epochs: 500
      checkpoint_interval: 5000
      eval_interval: 1000
      
  # VITS configuration for Twi
  vits:
    model_type: "VITS"
    language: "tw"
    
    audio:
      sample_rate: 22050
      hop_length: 256
      win_length: 1024
      n_mel_channels: 80
      
    model:
      n_symbols: 150
      spec_channels: 513
      segment_size: 8192
      inter_channels: 192
      hidden_channels: 192
      filter_channels: 768
      n_heads: 2
      n_layers: 6
      kernel_size: 3
      p_dropout: 0.1
      
    training:
      batch_size: 16
      learning_rate: 0.0002
      epochs: 1000
      checkpoint_interval: 5000
      
  # XTTS for voice cloning
  xtts:
    model_type: "XTTS"
    language: "tw"
    
    audio:
      sample_rate: 22050
      
    model:
      gpt_n_heads: 12
      gpt_n_layers: 12
      gpt_dim: 768
      condition_dim: 512
      
    cloning:
      min_reference_audio_length: 3.0  # seconds
      max_reference_audio_length: 30.0
      num_reference_samples: 5
      
# Vocoder configurations
vocoders:
  hifigan:
    model_type: "HiFiGAN"
    upsample_rates: [8, 8, 2, 2]
    upsample_kernel_sizes: [16, 16, 4, 4]
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    
  multiband_melgan:
    model_type: "MultiBandMelGAN"
    upsample_factors: [8, 4, 2]
    
# Dataset configuration
datasets:
  bible_tts:
    path: "/content/drive/MyDrive/voice-lab-data/processed/bible_tts"
    meta_file: "metadata.csv"
    text_column: "text_enhanced"
    audio_column: "audio_path"
    speaker_column: "speaker_id"
    
  financial_inclusion:
    path: "/content/drive/MyDrive/voice-lab-data/processed/financial_inclusion"
    meta_file: "metadata.csv"
    text_column: "text_enhanced"
    audio_column: "audio_path"
    
  custom_recordings:
    path: "/content/drive/MyDrive/voice-lab-data/processed/custom"
    meta_file: "metadata.csv"
    
# Text processing
text_processing:
  use_phonemes: true
  phoneme_language: "tw"
  use_enhanced_processor: true
  text_cleaners:
    - "twi_cleaners"
    - "twi_phoneme_cleaners"
    
  # Dialect settings
  dialects:
    default: "asante"
    available:
      - "asante"
      - "akuapem"
      - "fante"
      
# Training settings
training:
  # GPU settings
  use_cuda: true
  num_gpus: 1
  distributed: false
  
  # Paths
  output_path: "/content/drive/MyDrive/voice-lab-models/tts"
  checkpoint_path: "/content/drive/MyDrive/voice-lab-models/tts/checkpoints"
  tensorboard_path: "/content/drive/MyDrive/voice-lab-models/tts/tensorboard"
  
  # Mixed precision
  use_amp: true
  
  # Evaluation
  eval_split_size: 0.1
  test_split_size: 0.1
  
# Inference settings
inference:
  # Voice settings
  default_speaker: "asante_male_1"
  
  # Speed control
  speed_range: [0.5, 2.0]
  default_speed: 1.0
  
  # Pitch control
  pitch_range: [-5, 5]
  default_pitch: 0
  
  # Energy control
  energy_range: [0.5, 1.5]
  default_energy: 1.0
  
# Edge deployment
edge_deployment:
  model: "kokoro"
  
  kokoro:
    model_size: "82MB"
    quantization: "int8"
    optimize_for_mobile: true
    
  onnx:
    export: true
    optimize: true
    quantize: true
    
  tflite:
    export: true
    optimize: true
    
# Quality metrics
quality_metrics:
  compute_mos: true
  compute_pesq: true
  compute_stoi: true
  
  mos_threshold: 3.5  # Minimum acceptable MOS score
  
# Voice profiles
voice_profiles:
  asante_male_1:
    gender: "male"
    age_group: "adult"
    dialect: "asante"
    pitch_modifier: 0
    speed_modifier: 1.0
    
  asante_female_1:
    gender: "female"
    age_group: "adult"
    dialect: "asante"
    pitch_modifier: 2
    speed_modifier: 1.0
    
  akuapem_male_1:
    gender: "male"
    age_group: "adult"
    dialect: "akuapem"
    pitch_modifier: 0
    speed_modifier: 0.95
    
  fante_female_1:
    gender: "female"
    age_group: "adult"
    dialect: "fante"
    pitch_modifier: 1
    speed_modifier: 1.05