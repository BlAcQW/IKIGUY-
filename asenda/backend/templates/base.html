<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Asenda AI{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #1a1a2e;
            margin: 0;
            padding: 0;
            background-color: #f5f5f7;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .email-wrapper {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            padding: 32px;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }
        .logo span {
            opacity: 0.9;
        }
        .content {
            padding: 40px 32px;
        }
        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin: 0 0 24px 0;
        }
        p {
            margin: 0 0 16px 0;
            color: #4a4a6a;
        }
        .highlight-box {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
            border-left: 4px solid #6366f1;
            padding: 20px;
            border-radius: 8px;
            margin: 24px 0;
        }
        .highlight-box p {
            margin: 0;
            color: #1a1a2e;
        }
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            margin: 16px 0;
        }
        .steps {
            margin: 24px 0;
        }
        .step {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .step-number {
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .step-text {
            color: #4a4a6a;
            padding-top: 4px;
        }
        .footer {
            background-color: #1a1a2e;
            padding: 32px;
            text-align: center;
        }
        .footer p {
            color: #a1a1aa;
            font-size: 14px;
            margin: 8px 0;
        }
        .footer a {
            color: #6366f1;
            text-decoration: none;
        }
        .social-links {
            margin: 16px 0;
        }
        .social-links a {
            display: inline-block;
            margin: 0 8px;
            color: #a1a1aa;
        }
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e5e5e5, transparent);
            margin: 24px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="email-wrapper">
            <div class="header">
                <a href="https://asenda.ai" class="logo">asenda<span>.ai</span></a>
            </div>
            <div class="content">
                {% block content %}{% endblock %}
            </div>
            <div class="footer">
                <p><strong>Asenda AI</strong></p>
                <p>Intelligent Voice AI & Automation</p>
                <div class="divider"></div>
                <p>
                    <a href="https://asenda.ai">Website</a> &nbsp;|&nbsp;
                    <a href="mailto:hello@asenda.ai">Contact</a>
                </p>
                <p style="font-size: 12px; margin-top: 16px;">
                    &copy; {{ year if year else "2025" }} Asenda AI. All rights reserved.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
