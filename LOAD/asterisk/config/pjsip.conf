[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; Ant Cellular SIP Trunk (at 148.251.0.46 VitalPBX)
[ant-cellular]
type = endpoint
context = from-ant-cellular
disallow = all
allow = ulaw
allow = alaw
allow = g722
outbound_auth = ant-cellular-auth
aors = ant-cellular
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[ant-cellular-auth]
type = auth
auth_type = userpass
username = load
password = changeme

[ant-cellular]
type = aor
contact = sip:148.251.0.46:5060

[ant-cellular-identify]
type = identify
endpoint = ant-cellular
match = 148.251.0.46
