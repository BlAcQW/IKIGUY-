# Nginx configuration for proxy server (148.251.0.46)
# Forward whisper.ailabsafrica.com to RunPod internal URL
# Place this file at: /etc/nginx/sites-available/whisper.ailabsafrica.com
# Then create symlink: ln -s /etc/nginx/sites-available/whisper.ailabsafrica.com /etc/nginx/sites-enabled/
# Reload nginx: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name whisper.ailabsafrica.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name whisper.ailabsafrica.com;

    # SSL certificate configuration (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/whisper.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whisper.ailabsafrica.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    # Forward to RunPod internal URL
    location / {
        proxy_pass http://jzfmzviw26huka.runpod.internal:8011;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Buffering
        proxy_buffering off;
    }

    # WebSocket streaming endpoint
    location /ws/ {
        proxy_pass http://jzfmzviw26huka.runpod.internal:8011/ws/;
        proxy_http_version 1.1;
        
        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Extended timeout for WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

