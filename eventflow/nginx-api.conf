# EventFlow API - Full HTTPS Configuration
# Backend service running on port 30032

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name eventflow-api.ailabsafrica.com;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eventflow-api.ailabsafrica.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/eventflow-api.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eventflow-api.ailabsafrica.com/privkey.pem;

    # SSL optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Logging
    access_log /var/log/nginx/eventflow-api.access.log;
    error_log /var/log/nginx/eventflow-api.error.log;

    # Client body size (for file uploads if needed)
    client_max_body_size 10M;

    # Serve audio files directly (TTS generated audio)
    location /storage/audio/ {
        alias /opt/kasaai/apps/eventflow/backend/storage/audio/;
        expires 1d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";

        # Audio MIME types
        types {
            audio/mpeg mp3;
            audio/wav wav;
            audio/ogg ogg;
        }
    }

    # Proxy to EventFlow backend
    location / {
        proxy_pass http://127.0.0.1:30032;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket support (if needed for real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (optional - direct nginx response)
    location /nginx-health {
        access_log off;
        return 200 "EventFlow API nginx OK\n";
        add_header Content-Type text/plain;
    }
}
