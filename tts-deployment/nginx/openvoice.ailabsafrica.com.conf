# OpenVoice - Voice Cloning TTS
# Local GPU (20GB) - Port 8003

server {
    listen 80;
    listen [::]:80;
    server_name openvoice.ailabsafrica.com;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openvoice.ailabsafrica.com;

    ssl_certificate /etc/letsencrypt/live/openvoice.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvoice.ailabsafrica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 100M;

    access_log /var/log/nginx/openvoice.access.log;
    error_log /var/log/nginx/openvoice.error.log;

    location / {
        # CORS headers
        add_header 'Access-Control-Allow-Origin' 'https://flow.ailabsafrica.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Max-Age' '3600' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://localhost:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 90s;
        proxy_send_timeout 400s;
        proxy_read_timeout 400s;
    }

    location /health {
        proxy_pass http://localhost:8003/health;
        access_log off;
    }
}
