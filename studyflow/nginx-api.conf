# StudyFlow API Backend - Nginx Configuration
upstream studyflow_backend {
    server 127.0.0.1:30031 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name studyflow-api.ailabsafrica.com;

    access_log /var/log/nginx/studyflow-api_access.log;
    error_log /var/log/nginx/studyflow-api_error.log;

    client_max_body_size 100M;

    location / {
        proxy_pass http://studyflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /storage/ {
        alias /opt/kasaai/apps/studyflow/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
