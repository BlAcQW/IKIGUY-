server {
    listen 80;
    server_name erp.ailabsafrica.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.ailabsafrica.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/erp.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.ailabsafrica.com/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Root directory
    root /opt/kasaai/apps/erp/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve uploaded files (receipts, documents, etc.)
    # Proxy to API endpoint for proper access control
    location /uploads/ {
        # Preserve the full path including /uploads/ prefix
        proxy_pass http://localhost:30034/api/v1/finance/files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass authentication headers if needed
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Organization-ID $http_x_organization_id;
        
        # Increase timeouts for large files
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for file downloads
        proxy_buffering off;
    }

    # SPA routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logging
    access_log /var/log/nginx/erp_access.log;
    error_log /var/log/nginx/erp_error.log;
}
