[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; Ant Cellular SIP Trunk (at 148.251.0.46 VitalPBX)
[ant-cellular]
type = endpoint
context = from-ant-cellular
disallow = all
allow = ulaw
allow = alaw
allow = g722
outbound_auth = ant-cellular-auth
aors = ant-cellular
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[ant-cellular-auth]
type = auth
auth_type = userpass
username = load
password = changeme

[ant-cellular]
type = aor
contact = sip:148.251.0.46:5060

[ant-cellular-identify]
type = identify
endpoint = ant-cellular
match = 148.251.0.46

; ─────────────────────────────────────────────────────────
; GoIP GSM Gateway (Hybertone) — Ghanaian SIM cards (+233)
; ─────────────────────────────────────────────────────────
; Update GOIP_IP to match your GoIP device's LAN/WAN IP.
; Each GoIP port registers as a SIP endpoint to Asterisk.

[goip-trunk]
type = endpoint
context = from-goip
disallow = all
allow = ulaw
allow = alaw
outbound_auth = goip-auth
aors = goip-trunk
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[goip-auth]
type = auth
auth_type = userpass
username = goip
password = changeme-goip

[goip-trunk]
type = aor
contact = sip:GOIP_IP:5060
qualify_frequency = 30

[goip-identify]
type = identify
endpoint = goip-trunk
match = GOIP_IP

; ─────────────────────────────────────────────────────────
; SIP Softphone Endpoints (Free dev calls via Zoiper/Linphone/MicroSIP)
; ─────────────────────────────────────────────────────────
; Register your SIP softphone with server=<host-ip>:5060
; Username/password below. Calls route into Stasis(load).

; --- Template for softphone endpoints ---
[softphone-template](!)
type = endpoint
context = from-softphone
disallow = all
allow = ulaw
allow = alaw
allow = g722
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

; --- Dev softphone 1 ---
[dev1](softphone-template)
auth = dev1-auth
aors = dev1

[dev1-auth]
type = auth
auth_type = userpass
username = dev1
password = dev1pass

[dev1]
type = aor
max_contacts = 5
remove_existing = yes

; --- Dev softphone 2 ---
[dev2](softphone-template)
auth = dev2-auth
aors = dev2

[dev2-auth]
type = auth
auth_type = userpass
username = dev2
password = dev2pass

[dev2]
type = aor
max_contacts = 5
remove_existing = yes
