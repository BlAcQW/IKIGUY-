server {
    listen 80;
    server_name dev-erp.ailabsafrica.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev-erp.ailabsafrica.com;

    # SSL Configuration (will be configured by certbot)
    # ssl_certificate /etc/letsencrypt/live/dev-erp.ailabsafrica.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev-erp.ailabsafrica.com/privkey.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # Root directory
    root /opt/kasaai/apps/erp/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logging
    access_log /var/log/nginx/dev-erp_access.log;
    error_log /var/log/nginx/dev-erp_error.log;
}
