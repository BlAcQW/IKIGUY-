# Prometheus configuration for African Language Community Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "language_community_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Language Community API metrics
  - job_name: 'language-community-api'
    static_configs:
      - targets: ['localhost:8001']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 30s

  # MongoDB metrics (if mongodb_exporter is installed)
  - job_name: 'mongodb'
    static_configs:
      - targets: ['localhost:9216']
    scrape_interval: 30s

  # Nginx metrics (if nginx-prometheus-exporter is installed)
  - job_name: 'nginx'
    static_configs:
      - targets: ['localhost:9113']
    scrape_interval: 30s

  # Process exporter for detailed process monitoring
  - job_name: 'process'
    static_configs:
      - targets: ['localhost:9256']
    scrape_interval: 30s