# Initial config for SSL certificate acquisition
server {
    listen 80;
    listen [::]:80;
    server_name odoo.ailabsafrica.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Odoo setup in progress...';
        add_header Content-Type text/plain;
    }
}
