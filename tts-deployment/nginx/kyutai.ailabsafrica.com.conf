# Kyutai (Moshi) - Real-time Conversational AI
# RunPod GPU (48GB) via SSH tunnel - Port 8008

server {
    listen 80;
    listen [::]:80;
    server_name kyutai.ailabsafrica.com;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kyutai.ailabsafrica.com;

    ssl_certificate /etc/letsencrypt/live/kyutai.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kyutai.ailabsafrica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 100M;

    access_log /var/log/nginx/kyutai.access.log;
    error_log /var/log/nginx/kyutai.error.log;

    location / {
        # Proxies to RunPod via SSH tunnel
        proxy_pass http://localhost:8008;
        proxy_http_version 1.1;

        # WebSocket support for real-time communication
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Real-time streaming requires long timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for real-time streaming
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://localhost:8008/health;
        access_log off;
    }
}
