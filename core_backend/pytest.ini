[pytest]
# Pytest configuration for core_backend
# Created: 2025-10-26
# Purpose: Enable coverage tracking, test markers, and CI/CD integration

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Pytest options (run automatically)
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Short traceback format
    --tb=short
    # Coverage tracking
    --cov=backend
    --cov=apps.shared
    # Coverage reports
    --cov-report=html
    --cov-report=term-missing
    # Fail if coverage < 80%
    --cov-fail-under=80
    # Show warnings
    -W default
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Asyncio mode
    --asyncio-mode=auto

# Test markers (for organizing tests)
markers =
    unit: Unit tests (fast, isolated tests)
    integration: Integration tests (test component interactions)
    database: Database tests (test actual CRUD operations)
    slow: Slow tests (> 5 seconds)
    vapi: Tests related to VAPI functionality
    e2e: End-to-end tests
    asyncio: Async tests (automatically added by pytest-asyncio)

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage configuration
[coverage:run]
source = backend,apps/shared
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */migrations/*
    */venv/*
    */.venv/*

[coverage:report]
# Fail if coverage below threshold
fail_under = 80
# Show missing lines
show_missing = True
# Skip covered files
skip_covered = False
# Precision
precision = 2

[coverage:html]
directory = htmlcov

# Ignore certain patterns
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod
    # Don't complain about type checking blocks
    if TYPE_CHECKING:
