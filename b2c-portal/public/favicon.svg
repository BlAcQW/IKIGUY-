<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#171923"/>
  
  <!-- K Letter with gradient -->
  <g transform="translate(256, 256)">
    <defs>
      <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#20b2aa;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#00b4a6;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <!-- K Shape -->
    <path d="M -80 -120 L -40 -120 L -40 -20 L 40 -120 L 90 -120 L -10 0 L 90 120 L 40 120 L -40 20 L -40 120 L -80 120 Z" 
          fill="url(#gradient)" />
  </g>
  
  <!-- AI text -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="#20b2aa">AI</text>
</svg>