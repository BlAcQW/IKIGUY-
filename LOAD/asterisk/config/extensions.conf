[general]
static = yes
writeprotect = no

[from-ant-cellular]
; Inbound calls from Ant Cellular SIP trunk
; Route all inbound calls to the LOAD Stasis application
exten => _X.,1,NoOp(Inbound call from Ant Cellular: ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()
 same => n,Stasis(load)
 same => n,Hangup()

[to-ant-cellular]
; Outbound calls via Ant Cellular SIP trunk
exten => _X.,1,NoOp(Outbound call via Ant Cellular: ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@ant-cellular,60)
 same => n,Hangup()

[load-internal]
; Internal context for LOAD-originated calls
exten => _X.,1,NoOp(LOAD internal call: ${EXTEN})
 same => n,Stasis(load)
 same => n,Hangup()
