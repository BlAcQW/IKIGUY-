# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name language-community.ailabsafrica.com;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    return 301 https://language-community.ailabsafrica.com$request_uri;
}

# Main HTTPS Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name language-community.ailabsafrica.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/language-community.ailabsafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/language-community.ailabsafrica.com/privkey.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval' blob:; connect-src 'self' https://language-community-api.ailabsafrica.com wss://language-community-api.ailabsafrica.com https://*.supabase.co;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root directory for Vite built static files
    root /opt/kasaai/apps/community/frontend-main/dist;
    index index.html;

    # Optimizations for frontend app
    client_max_body_size 10M;
    keepalive_timeout 15s;
    sendfile on;
    tcp_nopush on;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;

    # API routes (proxy to backend)
    location /api/ {
        proxy_pass https://language-community-api.ailabsafrica.com/api/;
        proxy_ssl_verify off;
        proxy_set_header Host language-community-api.ailabsafrica.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $scheme://$host;

        # Handle large file uploads
        client_max_body_size 100M;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # WebSocket routes (proxy to backend)
    location /ws/ {
        proxy_pass https://language-community-api.ailabsafrica.com/api/v1/community/live/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host language-community-api.ailabsafrica.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket settings
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # CSS files - no cache for debugging
    location ~* \.css$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # Other static assets with optimal caching
    location ~* \.(js|png|jpg|jpeg|gif|ico|svg|webp|woff2|ttf|eot|woff)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # React Router SPA - main app routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block Sensitive Paths
    location ~* ^/(\.git|\.env|node_modules|src) {
        deny all;
        return 404;
    }

    # Robots.txt
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://language-community.ailabsafrica.com/sitemap.xml\n";
    }

    # Favicon
    location = /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Logging
    access_log /var/log/nginx/language-community-frontend.access.log;
    error_log /var/log/nginx/language-community-frontend.error.log warn;
}