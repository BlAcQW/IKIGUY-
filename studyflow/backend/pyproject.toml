# StudyFlow Backend - Python Project Configuration

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyflow-backend"
version = "0.1.0"
description = "AI-powered study assistance platform backend"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output options
addopts = [
    # Verbose output
    "-v",
    # Show local variables in tracebacks
    "-l",
    # Show summary of all test outcomes
    "-ra",
    # Strict markers (fail on unknown markers)
    "--strict-markers",
    # Strict config (fail on config warnings)
    "--strict-config",
    # Show warnings
    "-W", "default",
    # Coverage options
    "--cov=app",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=json",
    # CRITICAL: Fail if coverage is below 80%
    "--cov-fail-under=80",
    # Branch coverage
    "--cov-branch",
]

# Asyncio settings
asyncio_mode = "auto"

# Markers for test categorization
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, requires services)",
    "e2e: End-to-end tests (slowest, full system)",
    "database: Tests requiring database connection",
    "slow: Slow running tests",
    "auth: Authentication/authorization tests",
    "api: API endpoint tests",
]

# Minimum Python version
minversion = "7.0"

# Show captured output for failed tests only
log_cli = false
log_cli_level = "INFO"

# Fail on first failure (optional, useful for debugging)
# addopts = ["-x"]  # Uncomment to stop on first failure

[tool.coverage.run]
# This duplicates .coveragerc but provides TOML-based config
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "*/site-packages/*",
    "*/migrations/*",
    "*/scripts/*",
    "*/conftest.py",
    "app/__init__.py",
    "*/models/__init__.py",
    "*/api/__init__.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_empty = true
skip_covered = false
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "@overload",
    "\\.\\.\\.",
]
# Fail under 80% coverage
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
title = "StudyFlow Backend Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
show_contexts = true

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true
