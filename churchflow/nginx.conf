# ChurchFlow API Backend - Nginx Configuration
upstream churchflow_backend {
    server 127.0.0.1:30030 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name churchflow-api.ailabsafrica.com;

    access_log /var/log/nginx/churchflow-api_access.log;
    error_log /var/log/nginx/churchflow-api_error.log;

    client_max_body_size 100M;

    location / {
        proxy_pass http://churchflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
